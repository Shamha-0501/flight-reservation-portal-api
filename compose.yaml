services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    env_file:
      - .env
    environment:
      APP_URL: http://localhost
      DB_CONNECTION: mysql
      DB_DATABASE: ${DB_DATABASE:-laravel}
      DB_HOST: mysql
      DB_PASSWORD: password
      DB_PORT: 3306
      DB_USERNAME: sail
      REDIS_HOST: redis
    depends_on:
      - mysql
      - redis
    restart: unless-stopped
    networks:
      - appnet
    volumes:
      - app-storage:/var/www/html/storage

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - app
    ports:
      - "80:80"
    restart: unless-stopped
    networks:
      - appnet
    volumes:
      - ./:/var/www/html:ro
      - app-storage:/var/www/html/storage
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    env_file:
      - .env
    environment:
      APP_URL: http://localhost
      DB_CONNECTION: mysql
      DB_DATABASE: ${DB_DATABASE:-laravel}
      DB_HOST: mysql
      DB_PASSWORD: password
      DB_PORT: 3306
      DB_USERNAME: sail
      REDIS_HOST: redis
    depends_on:
      - app
      - mysql
      - redis
    restart: unless-stopped
    command: php artisan queue:work --sleep=1 --tries=3 --timeout=90
    networks:
      - appnet
    volumes:
      - app-storage:/var/www/html/storage

  mysql:
    image: mysql:8.4
    environment:
      DB_DATABASE: ${DB_DATABASE:-laravel}
      DB_PASSWORD: password
      DB_USERNAME: sail
      MYSQL_ALLOW_EMPTY_PASSWORD: 1
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: ${DB_DATABASE:-laravel}
      MYSQL_USER: sail
      MYSQL_PASSWORD: password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-p${DB_PASSWORD}"]
      retries: 5
      timeout: 5s
    restart: unless-stopped
    networks:
      - appnet
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:alpine
    restart: unless-stopped
    networks:
      - appnet
    volumes:
      - redis-data:/data

networks:
  appnet:

volumes:
  app-storage:
  mysql-data:
  redis-data:
